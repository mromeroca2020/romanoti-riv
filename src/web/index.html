<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Romanoti RIV Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Romanoti Infrastructure Visualizer (RIV)</h1>
      <p>Operational verification and closure demo</p>
    </header>

    <section class="card">
      <h2>Service Request Builder</h2>

      <label for="serviceType"><strong>Service Type</strong></label>
      <select id="serviceType">
        <option value="">-- Select service type --</option>
        <option value="patch_same_rack">Patch - Same Rack</option>
        <option value="patch_cross_rack">Patch - Cross Rack</option>
        <option value="patch_ohu">Patch - To Overhead Unit</option>
        <option value="power_cycle">Power Cycle</option>
        <option value="port_validation">Port Validation - Single Device</option>
        <option value="redundant_connectivity">Redundant Connectivity / A-B</option>
        <option value="network_device_task">Network Device Task</option>
        <option value="server_task">Server Task</option>
      </select>

      <br /><br />

      <label for="ticketNumber"><strong>Ticket Number</strong></label>
      <input type="text" id="ticketNumber" value="SCTASK13197644" />

      <br /><br />

      <div id="dynamicFields"></div>

      <label for="generatedDescription"><strong>Generated Ticket Description</strong></label>
      <textarea id="generatedDescription" rows="6" readonly>No ticket description generated yet.</textarea>

      <br /><br />
 
      <button id="analyzeBtn">Analyze Ticket</button>
    </section>

    <section class="card">
      <h2>Parsed Ticket</h2>
      <pre id="parsedOutput">No ticket analyzed yet.</pre>
    </section>

    <section class="card">
      <h2>Verification Report</h2>
      <pre id="reportOutput">No report generated yet.</pre>
    </section>

    <section class="card">
      <h2>Generated Runbook</h2>
      <ol id="runbookOutput">
        <li>No runbook generated yet.</li>
      </ol>
    </section>

    <section class="card">
      <h2>Suggested Ticket Closure</h2>
      <textarea id="closureOutput" rows="6" readonly>No closure generated yet.</textarea>
      <button id="copyClosureBtn">Copy Closure Text</button>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
