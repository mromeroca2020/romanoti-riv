<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Romanoti RIV Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Romanoti Infrastructure Visualizer (RIV)</h1>
      <p>Operational verification and closure demo</p>
    </header>

    <section class="card">
      <h2>Ticket Input</h2>

      <label for="ticketNumber"><strong>Ticket Number</strong></label>
      <input type="text" id="ticketNumber" value="SCTASK13197644" />

      <br /><br />

      <label for="shortDescription"><strong>Short Description</strong></label>
      <input type="text" id="shortDescription" value="MT10 || 20-Apr-26 || Others Specify" />

      <br /><br />

      <label for="description"><strong>Description</strong></label>
      <textarea id="description" rows="4">Work with Justin around power cycling nomt10ts03b terminal server</textarea>

      <br /><br />

      <button id="runDemoBtn">Analyze Ticket</button>
    </section>

    <section class="card">
      <h2>Parsed Ticket</h2>
      <pre id="parsedOutput">No ticket analyzed yet.</pre>
    </section>

    <section class="card">
      <h2>Verification Report</h2>
      <pre id="reportOutput">No report generated yet.</pre>
    </section>

    <section class="card">
      <h2>Generated Runbook</h2>
      <ol id="runbookOutput">
        <li>No runbook generated yet.</li>
      </ol>
    </section>

    <section class="card">
      <h2>Suggested Ticket Closure</h2>
      <textarea id="closureOutput" rows="6" readonly>No closure generated yet.</textarea>
      <button id="copyClosureBtn">Copy Closure Text</button>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
